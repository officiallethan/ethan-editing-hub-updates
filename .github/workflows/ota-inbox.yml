name: Process Ethan Hub OTA inbox

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ethan-hub-stable-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    if: github.repository == 'officiallethan/ethan-editing-hub-updates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Configure release commits
        run: |
          git config user.name "Ethan Hub OTA"
          git config user.email "324126614+officiallethan@users.noreply.github.com"
      - name: Process verified public Dropbox request inbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/ota_inbox.py process
          --folder-url "https://www.dropbox.com/scl/fo/sq3pmcx9ybnmsrrvr78m9/AApkrBLppkh55By938Z5Kf0?rlkey=o6yvzz0wkmpd1xknm9d2v24mr&dl=0"
