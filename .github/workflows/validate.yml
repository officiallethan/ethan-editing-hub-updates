name: Validate source and OTA package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'officiallethan/ethan-editing-hub-updates'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test release contracts
        run: python -m unittest discover -s tests -v
      - name: Build complete OTA package
        run: python tools/hub_release.py build
      - name: Verify package and feed
        run: python tools/hub_release.py verify
      - name: Check JavaScript syntax
        run: node --check src/com.ethan.editinghub/js/app.js
